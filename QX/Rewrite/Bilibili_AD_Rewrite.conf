// ==UserScript==
// @ScriptName        哔哩哔哩广告净化(自用)
// @Desc              由于QX不支持H2，故有此残缺版去广告
// @UpdateTime        2026-01-06
// @Attention         如果广告仍然存在，请清除缓存或卸载应用重新安装
// @Attention         如需引用请注明出处，谢谢合作！
// @ScriptURL         https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/Rewrite/Bilibili_AD_Rewrite.conf
// ==/UserScript==



hostname = app.bilibili.com

# 1. 开屏列表
^https:\/\/app\.bilibili\.com\/x\/v2\/splash\/list url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js


# 2. 个人信息
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/myinfo\? url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js


# 3. 首页推荐流 (去广告)
^https?:\/\/app\.bilibili\.com\/x\/v2\/feed\/index url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js


# 4. ★★★ Tab 导航 (这是你修改了逻辑的核心部分) ★★★
^https?:\/\/app\.bilibili\.com\/x\/resource\/show\/tab url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js


# 5. 我的页面
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/mine url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js


# 6. 右上角活动
^https?:\/\/app\.bilibili\.com\/x\/resource\/top\/activity url script-response-body https://raw.githubusercontent.com/lalalakkk-ui/AD_Block/refs/heads/Advertisement-Block/QX/JS/bilibili_custom.js




